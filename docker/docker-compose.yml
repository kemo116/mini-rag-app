services:
  mongodb:
    image: mongo:6-jammy
    container_name: mongodb
    ports:
      - "27007:27017"
    volumes:
      - mongodata:/data/db
    
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    networks:
      - backend
    restart: always

  pgvector:
    image: pgvector/pgvector:0.8.3-pg18-trixie
    container_name: pgvector
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRESS_PASSWORD}
    networks:
      - backend
    restart: always


networks:
 backend:

volumes:
  mongodata:
  pgvector_data: