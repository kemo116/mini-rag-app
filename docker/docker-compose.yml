services:
  # FastAPI Application
  fastapi:
    build:  
      context: ..
      dockerfile: docker/minirag/Dockerfile

    container_name: fastapi
    ports:
      - "8000:8000"
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
    env_file:
      - ./env/.env.app


  #Ngnix Service

  nginx:
    image: nginx:stable-trixie

    container_name: nginx
    ports:
      - "80:80"
    networks:
      - backend
    depends_on:
      - fastapi
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  #POstgreSQL (pgvector)

  pgvector:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: pgvector
    ports:
      - "5433:5432"

    volumes:
      - 'pgvector:/var/lib/postgresql'

    env_file:
      - ./env/.env.postgres

    networks:
      - backend

    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

# Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:v1.19
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    restart: always

# prometheus
  prometheus:
    image: prom/prometheus:v3.15.0-rc.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus:/etc/prometheus/secrets:ro
    networks:
      - backend
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'



# PostgreSQL Exporter
    
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    ports:
      - "8080:8080"
    env_file:
      - ./env/.env.postgres.exporter

    depends_on:
      - pgvector
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


# grafana
  grafana:
    image: grafana/grafana:nightly-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend
    restart: always
    depends_on:
      - prometheus
    env_file:
      - ./env/.env.grafana


#node exporter for system metrics

  node-exporter:
    image: prom/node-exporter:v1-busybox
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - backend
    restart: always
    depends_on:
      - prometheus
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'


networks:
  backend:
    driver: bridge

volumes:
  pgvector:
  qdrant_data:
  prometheus_data:
  grafana_data:
